<main class="landing flex min-h-full flex-col items-center justify-center gap-8 p-6 text-center">
	<icon-spider class="block w-[clamp(140px,25vw,280px)] h-auto" />

	<div class="flex max-w-[560px] flex-col gap-4">
		<h1 class="m-0 text-3xl font-bold text-[var(--c-text-primary)] md:text-4xl" translate>
			Pets
		</h1>

		<p class="m-0 text-[var(--c-text-secondary)]" translate>
			Медична картка, запис до спеціаліста та шлях до усиновлення — в одному місці, тож історія улюбленця не губиться між клініками, притулками та власниками.
		</p>
	</div>

	<div class="flex flex-wrap items-center justify-center gap-3">
		<a pButton routerLink="/sign" severity="primary" translate>Почати</a>
		<a pButton routerLink="/for-owners" severity="secondary" translate>Для власників тварин</a>
		<a pButton routerLink="/for-specialists" severity="secondary" translate>Для спеціалістів</a>
		<a pButton routerLink="/for-shelters" severity="secondary" translate>Для притулків</a>
		<a pButton routerLink="/for-businesses" severity="secondary" translate>Для бізнесу</a>
	</div>

	<div class="flex max-w-[720px] flex-col gap-3">
		<h2 class="m-0 text-lg font-semibold text-[var(--c-text-primary)]" translate>Мережа Pets</h2>
		<div class="flex flex-wrap items-center justify-center gap-2">
			@for (role of roleLinks; track role.path) {
				<a
					[routerLink]="role.path"
					class="rounded-full border border-[var(--c-border)] px-3 py-1 text-sm text-[var(--c-text-secondary)] no-underline hover:border-[var(--c-primary)] hover:text-[var(--c-primary)]"
					[translate]="role.label"
				></a>
			}
		</div>
	</div>
</main>
