<nav
	class="fixed inset-x-0 bottom-0 z-[100] hidden max-md:flex max-md:min-h-14 max-md:w-full max-md:items-center max-md:overflow-x-auto max-md:bg-[var(--c-bg-secondary)] max-md:px-1 max-md:shadow"
>
	<ul
		class="m-0 flex w-full list-none items-center justify-evenly gap-0 p-0"
	>
		<li class="inline-flex flex-none items-center">
			<app-nav-icon
				routerLink="/specialists"
				[ariaLabel]="translateService.translate('Specialists')()"
				icon="id-card"
			/>
		</li>

		<li class="inline-flex flex-none items-center">
			<app-nav-icon
				routerLink="/shelters"
				[ariaLabel]="translateService.translate('Shelters')()"
				icon="home"
			/>
		</li>

		<li class="inline-flex flex-none items-center">
			<app-nav-icon
				routerLink="/pets"
				[ariaLabel]="translateService.translate('Pets')()"
				icon="heart"
			/>
		</li>

		<li class="inline-flex flex-none items-center">
			<app-nav-icon
				routerLink="/feed"
				[ariaLabel]="translateService.translate('Feed')()"
				icon="images"
			/>
		</li>

		<li class="inline-flex flex-none items-center">
			<app-nav-icon
				[ariaLabel]="translateService.translate('Menu')()"
				[icon]="menuIcon()"
				(action)="onMenuClick()"
			/>
		</li>
	</ul>
</nav>
